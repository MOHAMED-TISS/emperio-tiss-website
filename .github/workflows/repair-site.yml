name: Repair site paths and legal pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-site.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix broken paths
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            public/en/about/index.html \
            public/en/contact/index.html \
            public/en/markets/index.html
          do
            sed -i \
              -e 's#../../../logo.png#../../logo.png#g' \
              -e 's#../../../style.css#../../style.css#g' \
              -e 's#../../../luxury-nav.css#../../luxury-nav.css#g' \
              -e 's#../../../luxury-nav.js#../../luxury-nav.js#g' \
              "$file"
          done

          sed -i 's#../markets/markets.html#../markets/#g' public/products/seafood.html
          sed -i 's#../about/about.html#../about/#g' public/about/index.html

      - name: Add legal pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/legal

          cat > public/legal/aviso-legal.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Aviso Legal | EMPERIO TISS</title>
            <meta name="description" content="Aviso legal de EMPERIO TISS S.L.">
            <link rel="stylesheet" href="../style.css">
          </head>
          <body>
            <main style="max-width:900px;margin:0 auto;padding:80px 24px;font-family:Arial,sans-serif;line-height:1.7">
              <h1>Aviso Legal</h1>
              <p><strong>EMPERIO TISS S.L.</strong></p>
              <p>Este sitio web pertenece a EMPERIO TISS S.L., con domicilio en Madrid, España.</p>
              <p>La información publicada en este sitio tiene carácter informativo y comercial. El acceso y uso del sitio implica la aceptación de las condiciones legales aplicables.</p>
              <p>Los contenidos, textos, imágenes, marcas y elementos gráficos del sitio están protegidos por la normativa aplicable y no podrán utilizarse sin autorización cuando esta sea necesaria.</p>
              <p><strong>Nota:</strong> esta página contiene información general y debe completarse y revisarse con los datos registrales y legales definitivos de la sociedad antes de considerarse un texto legal definitivo.</p>
            </main>
          </body>
          </html>
          EOF

          cat > public/legal/privacidad.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Política de Privacidad | EMPERIO TISS</title>
            <meta name="description" content="Política de privacidad de EMPERIO TISS S.L.">
            <link rel="stylesheet" href="../style.css">
          </head>
          <body>
            <main style="max-width:900px;margin:0 auto;padding:80px 24px;font-family:Arial,sans-serif;line-height:1.7">
              <h1>Política de Privacidad</h1>
              <p><strong>EMPERIO TISS S.L.</strong></p>
              <p>EMPERIO TISS S.L. tratará los datos personales recibidos a través de este sitio únicamente para gestionar consultas comerciales, comunicaciones y las finalidades que correspondan a la relación solicitada.</p>
              <p>Los datos se conservarán durante el tiempo necesario para atender la solicitud y, cuando proceda, durante los plazos exigidos por la normativa aplicable.</p>
              <p>Las personas interesadas podrán ejercer los derechos que les reconozca la normativa de protección de datos mediante una solicitud dirigida a EMPERIO TISS S.L.</p>
              <p><strong>Nota:</strong> esta página es un texto provisional y debe completarse con la identidad jurídica completa del responsable, base legal, datos de contacto para derechos, información sobre proveedores y demás requisitos exigibles antes de su publicación como política definitiva.</p>
            </main>
          </body>
          </html>
          EOF

          cat > public/legal/cookies.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Política de Cookies | EMPERIO TISS</title>
            <meta name="description" content="Política de cookies de EMPERIO TISS S.L.">
            <link rel="stylesheet" href="../style.css">
          </head>
          <body>
            <main style="max-width:900px;margin:0 auto;padding:80px 24px;font-family:Arial,sans-serif;line-height:1.7">
              <h1>Política de Cookies</h1>
              <p><strong>EMPERIO TISS S.L.</strong></p>
              <p>Este sitio puede utilizar tecnologías necesarias para su funcionamiento y, en su caso, tecnologías destinadas a analizar el uso del sitio o proporcionar determinadas funcionalidades.</p>
              <p>Las cookies no necesarias solo deberán utilizarse de acuerdo con las opciones de consentimiento y las obligaciones legales aplicables.</p>
              <p><strong>Nota:</strong> esta página es provisional. Debe completarse después de verificar las cookies, servicios de terceros, herramientas de analítica y tecnologías realmente utilizadas por el sitio.</p>
            </main>
          </body>
          </html>
          EOF

      - name: Verify targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R '../../../\(logo.png\|style.css\|luxury-nav.css\|luxury-nav.js\)' public/en/about/index.html public/en/contact/index.html public/en/markets/index.html
          ! grep -R '../markets/markets.html' public/products/seafood.html
          ! grep -R '../about/about.html' public/about/index.html
          test -f public/legal/aviso-legal.html
          test -f public/legal/privacidad.html
          test -f public/legal/cookies.html

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/en/about/index.html public/en/contact/index.html public/en/markets/index.html public/products/seafood.html public/about/index.html public/legal/
          git commit -m 'Fix broken website paths and add legal pages'
          git push

          rm -f .github/workflows/repair-site.yml
          git add .github/workflows/repair-site.yml
          git commit -m 'Remove one-shot repair workflow'
          git push
