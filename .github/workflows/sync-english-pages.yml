name: Sync English pages with main site structure

on:
  push:
    branches: [fix/en-match-spanish]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror root subpages into English paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/en/about public/en/contact public/en/markets public/en/products
          cp public/about/index.html public/en/about/index.html
          cp public/contact/index.html public/en/contact/index.html
          cp public/markets/index.html public/en/markets/index.html
          cp public/products/index.html public/en/products/index.html
          cp public/products/seafood.html public/en/products/seafood.html
          cp public/products/fruits-vegetables.html public/en/products/fruits-vegetables.html
          cp public/products/seasonal.html public/en/products/seasonal.html

          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('public/en/about/index.html'),
              Path('public/en/contact/index.html'),
              Path('public/en/markets/index.html'),
              Path('public/en/products/index.html'),
              Path('public/en/products/seafood.html'),
              Path('public/en/products/fruits-vegetables.html'),
              Path('public/en/products/seasonal.html'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              for name in ('style.css','luxury-nav.css','products.css','logo.png','script.js'):
                  s = s.replace(f'href="../{name}"', f'href="../../{name}"')
                  s = s.replace(f'src="../{name}"', f'src="../../{name}"')
              for name in ('markets.css','contact.css'):
                  s = s.replace(f'href="{name}"', f'href="../{name}"')
              s = s.replace('../es/index.html', '../../index.html')
              s = s.replace('../fr/index.html', '../../index.html')
              s = s.replace('../ar/index.html', '../../index.html')
              s = s.replace('<a href="../index.html">EN</a>', '<a href="../index.html" class="current">EN</a>')
              s = s.replace('> Inicio<', '> Home<').replace('> Empresa<', '> Company<').replace('> Productos<', '> Products<').replace('> Mercados<', '> Markets<').replace('> Contacto<', '> Contact<')
              s = s.replace('Navegación principal', 'Main navigation').replace('Abrir menú', 'Open menu').replace('Consulta empresarial', 'Business enquiry')
              s = s.replace('Madrid · Europa · África · Mediterráneo', 'Madrid · Europe · Africa · Mediterranean')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate English paths and HTML structure
        run: |
          set -euo pipefail
          test -f public/en/about/index.html
          test -f public/en/contact/index.html
          test -f public/en/markets/index.html
          test -f public/en/products/index.html
          test -f public/en/products/seafood.html
          test -f public/en/products/fruits-vegetables.html
          test -f public/en/products/seasonal.html
          ! grep -R 'href="../style.css"' public/en/about public/en/contact public/en/markets public/en/products
          ! grep -R 'href="../luxury-nav.css"' public/en/about public/en/contact public/en/markets public/en/products
          ! grep -R 'src="../luxury-nav.js"' public/en/about public/en/contact public/en/markets public/en/products
          grep -R '<html lang="en">' public/en/about public/en/contact public/en/markets public/en/products

      - name: Commit mirrored pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/en
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: align English subpages with main site structure'
          git push
