name: Format repository code once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format-code-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install formatting tools
        run: |
          npm init -y
          npm install --no-save prettier@3.6.2 js-beautify@1.15.4 sql-formatter@15.6.4

      - name: Format repository source and configuration files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const ignoredDirectories = new Set(['.git', 'node_modules']);
          const formattingTargets = new Set([
            '.css',
            '.html',
            '.js',
            '.json',
            '.jsonc',
            '.mjs',
            '.sql',
            '.yaml',
            '.yml',
          ]);

          async function loadTools() {
            const prettierModule = await import('prettier');
            const beautifyModule = await import('js-beautify');
            const sqlFormatterModule = await import('sql-formatter');

            return {
              prettier: prettierModule.default ?? prettierModule,
              beautifyHtml:
                beautifyModule.html ?? beautifyModule.default?.html,
              beautifyJs:
                beautifyModule.js ?? beautifyModule.js_beautify ?? beautifyModule.default?.js,
              beautifyCss:
                beautifyModule.css ?? beautifyModule.css_beautify ?? beautifyModule.default?.css,
              formatSql:
                sqlFormatterModule.format ?? sqlFormatterModule.default?.format,
            };
          }

          function walk(directory) {
            const results = [];

            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.isDirectory() && ignoredDirectories.has(entry.name)) {
                continue;
              }

              const fullPath = path.join(directory, entry.name);

              if (entry.isDirectory()) {
                results.push(...walk(fullPath));
              } else if (formattingTargets.has(path.extname(entry.name).toLowerCase())) {
                results.push(fullPath);
              }
            }

            return results;
          }

          function ensureTrailingNewline(value) {
            return value.endsWith('\n') ? value : `${value}\n`;
          }

          async function formatFile(filePath, tools) {
            const extension = path.extname(filePath).toLowerCase();
            const source = fs.readFileSync(filePath, 'utf8');
            let formatted = source;

            try {
              switch (extension) {
                case '.html':
                  formatted = tools.beautifyHtml(source, {
                    indent_size: 2,
                    indent_inner_html: true,
                    wrap_line_length: 0,
                    wrap_attributes: 'auto',
                    end_with_newline: true,
                    extra_liners: '',
                  });
                  break;

                case '.js':
                case '.mjs':
                  formatted = tools.beautifyJs(source, {
                    indent_size: 2,
                    indent_level: 0,
                    max_preserve_newlines: 2,
                    preserve_newlines: true,
                    keep_array_indentation: false,
                    space_in_empty_paren: false,
                    end_with_newline: true,
                    wrap_line_length: 100,
                  });
                  break;

                case '.css':
                  formatted = tools.beautifyCss(source, {
                    indent_size: 2,
                    end_with_newline: true,
                    wrap_line_length: 100,
                  });
                  break;

                case '.json':
                  try {
                    formatted = `${JSON.stringify(JSON.parse(source), null, 2)}\n`;
                  } catch {
                    formatted = tools.beautifyJs(source, {
                      indent_size: 2,
                      end_with_newline: true,
                    });
                  }
                  break;

                case '.jsonc':
                case '.yaml':
                case '.yml':
                  try {
                    formatted = await tools.prettier.format(source, {
                      filepath: filePath,
                      useTabs: false,
                      tabWidth: 2,
                      printWidth: 100,
                    });
                  } catch {
                    console.warn(`Prettier skipped legacy config: ${filePath}`);
                  }
                  break;

                case '.sql':
                  try {
                    formatted = ensureTrailingNewline(
                      tools.formatSql(source, {
                        language: 'sqlite',
                        tabWidth: 2,
                        keywordCase: 'preserve',
                      }).trim(),
                    );
                  } catch {
                    console.warn(`SQL formatter skipped: ${filePath}`);
                  }
                  break;

                default:
                  return;
              }
            } catch (error) {
              console.warn(`Formatter skipped ${filePath}: ${error.message}`);
              return;
            }

            if (formatted !== source) {
              fs.writeFileSync(filePath, formatted, 'utf8');
              console.log(`Formatted: ${filePath}`);
            }
          }

          (async () => {
            const tools = await loadTools();
            const files = walk(root);

            for (const filePath of files) {
              await formatFile(filePath, tools);
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Remove temporary formatter workflow
        run: rm -f .github/workflows/format-code-once.yml

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No formatting changes detected."
            exit 0
          fi

          git add -A
          git commit -m "chore: format repository source code"
          git push origin main
