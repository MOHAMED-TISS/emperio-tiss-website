name: Format repository code once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format-code-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format source and configuration files
        run: |
          npx --yes prettier@3.6.2 --write \
            "**/*.html" \
            "**/*.css" \
            "**/*.js" \
            "**/*.mjs" \
            "**/*.json" \
            "**/*.jsonc" \
            "**/*.yml" \
            "**/*.yaml" \
            --ignore-unknown

      - name: Remove temporary formatter workflow
        run: rm -f .github/workflows/format-code-once.yml

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No formatting changes detected."
            exit 0
          fi

          git add -A
          git commit -m "chore: format repository source code"
          git push origin main
