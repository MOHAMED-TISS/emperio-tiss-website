name: Sync Fruits & Vegetables catalogue images

on:
  push:
    paths:
      - 'public/assets/products/fruits-vegetables/incoming/**'
      - 'public/assets/data/catalog-v1.3.json'
      - '.github/workflows/sync-produce-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build produce image manifest
        shell: python
        run: |
          import json
          import re
          import unicodedata
          from pathlib import Path

          incoming = Path('public/assets/products/fruits-vegetables/incoming')
          manifest_path = Path('public/assets/data/product-images.json')
          catalog_path = Path('public/assets/data/catalog-v1.3.json')

          def key(value):
              value = unicodedata.normalize('NFKD', str(value or '')).encode('ascii', 'ignore').decode('ascii').lower()
              value = re.sub(r'\.[a-z0-9]+$', '', value)
              value = re.sub(r'(?:[\s_-]*\(?\d+\)?)+$', '', value)
              value = re.sub(r'[^a-z0-9]+', '-', value).strip('-')
              return value

          try:
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          except Exception:
              manifest = {}

          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          products = [p for p in catalog.get('products', []) if p.get('family') == 'produce']
          aliases = {}
          for product in products:
              pid = product.get('id', '')
              names = [pid, product.get('commercialName', '')]
              for variety in product.get('varieties', []) or []:
                  names.append(variety)
              for name in names:
                  k = key(name)
                  if k:
                      aliases[k] = pid

          allowed = {'.jpg', '.jpeg', '.png', '.webp'}
          grouped = {}
          for path in sorted(incoming.iterdir() if incoming.exists() else []):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              product_id = aliases.get(key(path.name))
              if not product_id:
                  continue
              grouped.setdefault(product_id, []).append('/assets/products/fruits-vegetables/incoming/' + path.name)

          # Remove only images previously generated from the Fruits & Vegetables intake folder.
          for product_id, images in list(manifest.items()):
              remaining = [img for img in images if not str(img).startswith('/assets/products/fruits-vegetables/incoming/')]
              if remaining:
                  manifest[product_id] = remaining
              else:
                  del manifest[product_id]

          for product_id, images in grouped.items():
              manifest[product_id] = images

          manifest_path.write_text(
              json.dumps(dict(sorted(manifest.items())), ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

      - name: Validate generated manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest = json.loads(Path('public/assets/data/product-images.json').read_text(encoding='utf-8'))
          for product_id, images in manifest.items():
              assert isinstance(images, list), f'{product_id}: images must be an array'
              assert all(isinstance(image, str) and image.startswith('/') for image in images), f'{product_id}: invalid image path'

      - name: Commit generated manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/data/product-images.json
          if git diff --cached --quiet; then
            echo 'No manifest changes.'
            exit 0
          fi
          git commit -m 'Auto-sync Fruits & Vegetables catalogue images'
          git push
