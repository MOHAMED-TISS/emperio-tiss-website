name: Validate SEO indexing architecture

on:
  push:
    paths:
      - 'public/**'
      - 'src/index.js'
      - 'src/seo-worker.js'
      - 'src/seo-metadata.js'
      - 'tests/seo-*.test.mjs'
      - '.github/workflows/validate-seo-indexing.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'src/index.js'
      - 'src/seo-worker.js'
      - 'src/seo-metadata.js'
      - 'tests/seo-*.test.mjs'
      - '.github/workflows/validate-seo-indexing.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/seo-worker.js
          node --check src/seo-metadata.js
      - name: SEO route and page tests
        run: node --test tests/seo-metadata.test.mjs tests/seo-pages.test.mjs
