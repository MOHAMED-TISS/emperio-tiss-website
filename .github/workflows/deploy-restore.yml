name: Deploy restored EMPERIO TISS state

on:
  push:
    branches:
      - emergency/deploy-restore-20260904
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy restored Worker and assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout restored state
        uses: actions/checkout@v7

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing from GitHub Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing from GitHub Actions secrets."; exit 1; }

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.129.0

      - name: Deploy Worker and Static Assets
        run: npx --no-install wrangler deploy --config ./wrangler.jsonc
