name: Validate multilingual market catalogues

on:
  push:
    paths:
      - 'public/assets/data/catalogue-market-priority.json'
      - 'public/assets/data/catalog-v1.3.json'
      - 'public/assets/js/market-catalogue.js'
      - 'public/assets/js/international-shell.js'
      - 'public/assets/css/catalogue-market-unified.css'
      - 'tests/market-catalogue.test.mjs'
      - 'public/ar/**'
      - 'public/assets/css/ar/**'
      - 'public/assets/js/ar/**'
      - 'tests/ar-es-design.test.mjs'
      - 'tests/ar-es-normalizer.test.mjs'
      - 'tests/ar-language-separation.test.mjs'
      - '.github/workflows/validate-market-catalogues.yml'
  pull_request:
    paths:
      - 'public/assets/data/catalogue-market-priority.json'
      - 'public/assets/data/catalog-v1.3.json'
      - 'public/assets/js/market-catalogue.js'
      - 'public/assets/js/international-shell.js'
      - 'public/assets/css/catalogue-market-unified.css'
      - 'tests/market-catalogue.test.mjs'
      - 'public/ar/**'
      - 'public/assets/css/ar/**'
      - 'public/assets/js/ar/**'
      - 'tests/ar-es-design.test.mjs'
      - 'tests/ar-es-normalizer.test.mjs'
      - 'tests/ar-language-separation.test.mjs'
      - '.github/workflows/validate-market-catalogues.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check public/assets/js/market-catalogue.js
          node --check public/assets/js/international-shell.js
          node --check public/assets/js/ar/es-normalizer.js
          node --check public/assets/js/ar/content-geography.js
          node --check public/assets/js/ar/catalogue-taxonomy.js
          node --check public/assets/js/ar/loader.js
      - name: Catalogue tests
        run: node --test tests/market-catalogue.test.mjs
      - name: Arabic ES parity tests
        run: node --test tests/ar-es-design.test.mjs
      - name: Arabic normalizer tests
        run: node --test tests/ar-es-normalizer.test.mjs
      - name: Arabic separation tests
        run: node --test tests/ar-language-separation.test.mjs
