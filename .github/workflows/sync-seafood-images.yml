name: Sync seafood catalogue images

on:
  push:
    paths:
      - 'public/assets/products/incoming/**'
      - 'public/assets/data/catalog-v1.3.json'
      - '.github/workflows/sync-seafood-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build seafood image manifest
        shell: python
        run: |
          import json
          import re
          import unicodedata
          from pathlib import Path

          incoming = Path('public/assets/products/incoming')
          manifest_path = Path('public/assets/data/product-images.json')
          catalog_path = Path('public/assets/data/catalog-v1.3.json')

          try:
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          except Exception:
              manifest = {}

          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          products = [p for p in catalog.get('products', []) if p.get('family') == 'seafood' and p.get('status') == 'active']

          def normalise(value):
              value = unicodedata.normalize('NFKD', str(value or '')).encode('ascii', 'ignore').decode().lower()
              value = re.sub(r'\.[^.]+$', '', value)
              value = re.sub(r'\(\s*\d+\s*\)|[-_ ]?\d+$', '', value)
              value = re.sub(r'[^a-z0-9]+', ' ', value)
              return re.sub(r'\s+', ' ', value).strip()

          aliases = {}
          for product in products:
              product_id = product.get('id')
              if not product_id:
                  continue
              names = [product_id, product.get('commercialName'), *(product.get('varieties') or [])]
              for name in names:
                  key = normalise(name)
                  if key:
                      aliases[key] = product_id

          # Filename aliases for active Fish catalogue IDs that are already
          # handled by the Fish renderer but may not yet exist in the
          # central catalogue metadata.
          filename_aliases = {
              'lenguado': 'sole'
          }

          allowed = {'.jpg', '.jpeg', '.png', '.webp'}
          grouped = {}

          def natural_key(path):
              stem = re.sub(r'\.[^.]+$', '', path.name).strip()
              match = re.match(r'^(.*?)(?:\s*[-_ ]?\(?\s*(\d+)\s*\)?)?$', stem)
              base = (match.group(1) if match else stem).strip().lower()
              number = int(match.group(2)) if match and match.group(2) else 0
              has_number = 1 if match and match.group(2) else 0
              return (base, has_number, number, stem.lower())

          for path in sorted(incoming.iterdir() if incoming.exists() else [], key=natural_key):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              key = normalise(path.stem)
              product_id = aliases.get(key) or filename_aliases.get(key)
              if not product_id:
                  continue
              grouped.setdefault(product_id, []).append('/assets/products/incoming/' + path.name)

          # Remove paths generated from the seafood incoming folder, preserving all other catalogue families.
          seafood_prefix = '/assets/products/incoming/'
          for product_id, images in list(manifest.items()):
              if not isinstance(images, list):
                  images = [images] if images else []
              remaining = [img for img in images if not (isinstance(img, str) and img.startswith(seafood_prefix))]
              if remaining:
                  manifest[product_id] = remaining
              else:
                  del manifest[product_id]

          for product_id, images in grouped.items():
              manifest[product_id] = images

          manifest_path.write_text(
              json.dumps(dict(sorted(manifest.items())), ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

      - name: Commit and push generated manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/data/product-images.json
          if git diff --cached --quiet; then
            echo 'No manifest changes.'
            exit 0
          fi
          git commit -m 'Auto-sync seafood catalogue images'

          # Another repository write can land between checkout and push.
          # Rebase onto the current main tip before pushing so generated
          # catalogue updates do not fail with a non-fast-forward error.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo 'Rebase conflict detected; retrying from current origin/main.'
            fi
            sleep $((attempt * 2))
          done

          echo 'Unable to push generated seafood manifest after 5 attempts.'
          exit 1
