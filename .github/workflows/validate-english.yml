name: Validate multilingual site

on:
  push:
    branches: [main, test/website-architecture-cleanup]
    paths: ['public/**', '.github/workflows/validate-english.yml']
  pull_request:
    paths: ['public/**', '.github/workflows/validate-english.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('public')
          required = [
              root / 'assets/css/global.css',
              root / 'assets/js/global.js',
              root / 'assets/js/nav-normalizer.js',
              root / 'assets/js/seo.js',
              root / 'logo.png',
          ]
          for path in required:
              assert path.exists(), f'Missing required file: {path}'

          forbidden_files = {
              'fish-demo-header.css',
              'fish-footer.css',
              'fish-header-float.css',
              'product-nav-prototype.css',
              'global-core.js',
              'rtl-fix.css',
          }
          for path in root.rglob('*'):
              if path.is_file():
                  assert path.name not in forbidden_files, f'Legacy file remains: {path}'

          html_files = list(root.rglob('*.html'))
          assert html_files, 'No HTML files found'

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              assert '/assets/css/global.css' in text, f'{path}: missing global.css'
              assert '/assets/js/global.js' in text, f'{path}: missing global.js'
              lang = re.search(r'<html\b[^>]*\blang=["\']([^"\']+)', text, re.I)
              assert lang, f'{path}: missing html lang'
              if lang.group(1).lower().startswith('ar'):
                  assert re.search(r'<html\b[^>]*\bdir=["\']rtl["\']', text, re.I), f'{path}: missing RTL dir'
              for ref in re.findall(r'(?:href|src)=["\'](/assets/[^"\']+)', text, re.I):
                  assert (root / ref.lstrip('/')).exists(), f'{path}: missing asset {ref}'

          fish = root / 'en/products/seafood/fish/index.html'
          fish_text = fish.read_text(encoding='utf-8')
          assert 'fish-catalog-pilot' not in fish_text, 'Fish pilot class remains'
          assert fish_text.count('<style>') == 0, 'Fish still contains page-level style block'
          assert 'page-hero--fish' in fish_text, 'Fish hero modifier missing'

          global_text = (root / 'assets/js/global.js').read_text(encoding='utf-8')
          assert 'nav-normalizer.js' in global_text, 'Canonical nav normalizer is not loaded'
          assert 'footer.css' in global_text, 'Canonical footer component is not loaded'

          nav_css = (root / 'assets/css/components/nav.css').read_text(encoding='utf-8')
          assert 'font-size:40px' in nav_css
          assert 'font-size:35px' in nav_css
          assert 'font-size:25px' in nav_css
          assert '.nav-products>.nav-products-links>details>summary::after' in nav_css

          hero_css = (root / 'assets/css/components/hero.css').read_text(encoding='utf-8')
          assert '.page-hero--fish' in hero_css
          assert '.page-hero--shellfish' in hero_css
          assert '.page-hero--cephalopods' in hero_css
          print(f'Validated {len(html_files)} HTML files successfully.')
          print('FINAL ARCHITECTURE VALIDATION PASSED')
          PY