name: Validate multilingual site

on:
  pull_request:
    paths:
      - 'public/**'
      - '.github/workflows/validate-english.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/validate-english.yml'

jobs:
  site-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML structure, routes, assets and language roots
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('public')
          expected = {
              'es': {
                  'index.html','about/index.html','contact/index.html','markets/index.html','products/index.html',
                  'products/seafood.html','products/fruits-vegetables.html','products/seasonal.html'
              },
              'en': {
                  'index.html','about/index.html','contact/index.html','markets/index.html','news/index.html','products/index.html',
                  'products/seafood.html','products/fruits-vegetables.html','products/seasonal.html'
              },
              'fr': {
                  'index.html','about/index.html','contact/index.html','markets/index.html','products/index.html',
                  'products/seafood.html','products/fruits-vegetables.html','products/seasonal.html'
              },
              'ar': {
                  'index.html','about/index.html','contact/index.html','markets/index.html','products/index.html',
                  'products/seafood.html','products/fruits-vegetables.html','products/seasonal.html'
              },
          }

          for language, routes in expected.items():
              base = root / language
              pages = sorted(base.rglob('*.html'))
              actual = {p.relative_to(base).as_posix() for p in pages}
              assert actual == routes, f'{language}: route set mismatch: {sorted(actual)}'
              for page in pages:
                  text = page.read_text(encoding='utf-8')
                  assert f'<html lang="{language}"' in text, f'{page}: wrong/missing lang'
                  assert text.count('id="intlMenu"') <= 1, f'{page}: duplicate international menu'
                  assert text.count('id="menuToggleBtn"') <= 1, f'{page}: duplicate global menu'
                  for href in re.findall(r'(?:href|src)="([^"]+)"', text):
                      if href.startswith(('http://','https://','mailto:','tel:','#','//')): continue
                      clean = href.split('#',1)[0].split('?',1)[0]
                      target = (page.parent / clean).resolve() if not clean.startswith('/') else (root / clean.lstrip('/')).resolve()
                      assert target.exists(), f'{page}: missing local target {href} -> {target}'

          assert (root / 'logo.png').exists(), 'Missing canonical logo'
          assert (root / 'international-pages.css').exists(), 'Missing international CSS'
          assert (root / 'international-nav.js').exists(), 'Missing international navigation JS'
          print('Validated ES, EN, FR and AR route sets, local targets and shared international assets.')
          PY
